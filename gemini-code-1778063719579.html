<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Finance Cockpit Cloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6;
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding: env(safe-area-inset-top) 15px 20px 15px; 
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent), var(--bg);
        }

        .container { max-width: 800px; margin: auto; }
        
        /* LOGIN OVERLAY */
        #login-overlay { 
            position: fixed; inset: 0; background: var(--bg); 
            display: flex; align-items: center; justify-content: center; z-index: 9999; 
        }
        .login-box { 
            background: var(--card); padding: 30px; border-radius: 24px; 
            width: 90%; max-width: 350px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }

        /* DASHBOARD */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-top: 10px; }
        h1 { font-family: 'Urbanist', sans-serif; font-size: 1.5rem; margin: 0; }
        h1 span { color: var(--accent); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; margin-top: 5px; }

        .main-card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        input, select, button { 
            width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; 
            border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem;
        }
        button { background: var(--accent); border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .logout-btn { background: transparent; color: var(--danger); width: auto; font-size: 0.8rem; border: none; padding: 0; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        td { padding: 15px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Écran de Connexion -->
    <div id="login-overlay">
        <div class="login-box">
            <h1>Finance <span>Cloud</span></h1>
            <p style="color:#94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Accès sécurisé et synchronisé</p>
            <input type="email" id="email" placeholder="Email (celui créé dans Firebase)">
            <input type="password" id="password" placeholder="Mot de passe">
            <button onclick="login()">Se connecter</button>
        </div>
    </div>

    <!-- Application Principale -->
    <div id="app-content" class="container hidden">
        <div class="header">
            <h1>Cockpit <span>Synchro</span></h1>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i> Quitter</button>
        </div>

        <div class="stat-grid">
            <div class="stat-card" style="grid-column: 1 / -1;">
                <div class="stat-label">Solde Net Restant</div>
                <div id="total-net" style="font-size: 2.2rem; font-weight: 800; color: var(--accent);">0.00 CHF</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Entrées</div>
                <div id="total-inc" style="color: var(--success); font-weight: 700;">+ 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Sorties</div>
                <div id="total-exp" style="color: var(--danger); font-weight: 700;">- 0.00</div>
            </div>
        </div>

        <div class="main-card">
            <form id="entry-form">
                <input type="date" id="f-date" required>
                <input type="text" id="f-desc" placeholder="Libellé (ex: Salaire, Loyer...)" required>
                <input type="number" id="f-amt" step="0.01" placeholder="Montant en CHF" required>
                <select id="f-type">
                    <option value="expense">📉 Dépense</option>
                    <option value="income">📈 Revenu</option>
                </select>
                <button type="submit">Enregistrer au Cloud</button>
            </form>
        </div>

        <div class="main-card">
            <h3><i class="fa-solid fa-list-ul"></i> Historique</h3>
            <table id="data-table">
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        // Importation des SDK Firebase via CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURATION FIREBASE INTÉGRÉE
        const firebaseConfig = {
            apiKey: "AIzaSyAV_k_524LY4pPlEngZ763qeq8viYFLgJk",
            authDomain: "mybudget-ecb46.firebaseapp.com",
            projectId: "mybudget-ecb46",
            storageBucket: "mybudget-ecb46.firebasestorage.app",
            messagingSenderId: "891853073723",
            appId: "1:891853073723:web:29ec6bcf063a7fa8e8db1e",
            measurementId: "G-Q4DFKZLXLG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Fonctions de navigation et auth
        window.login = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Identifiants incorrects. Vérifiez votre compte Firebase."));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                loadData(user.uid);
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // Lecture en temps réel
        function loadData(uid) {
            const q = query(collection(db, "transactions"), where("uid", "==", uid), orderBy("date", "desc"));
            onSnapshot(q, (snap) => {
                let inc = 0, exp = 0, html = "";
                snap.forEach((d) => {
                    const t = d.data();
                    const amt = parseFloat(t.amt);
                    if(t.type === 'income') inc += amt; else exp += amt;
                    html += `<tr>
                        <td style="width:75px; font-size:0.7rem; color:#94a3b8">${t.date}</td>
                        <td style="font-weight:600">${t.desc}</td>
                        <td style="text-align:right; color:${t.type==='income'?'var(--success)':'var(--danger)'}">${amt.toFixed(2)}</td>
                        <td style="text-align:right; width:30px"><i class="fa-solid fa-trash" onclick="deleteItem('${d.id}')" style="color:#334155; cursor:pointer"></i></td>
                    </tr>`;
                });
                document.getElementById('table-body').innerHTML = html;
                document.getElementById('total-inc').innerText = "+ " + inc.toFixed(2);
                document.getElementById('total-exp').innerText = "- " + exp.toFixed(2);
                document.getElementById('total-net').innerText = (inc - exp).toFixed(2) + " CHF";
            });
        }

        // Ajout d'une dépense
        document.getElementById('entry-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Synchronisation...";
            btn.disabled = true;

            await addDoc(collection(db, "transactions"), {
                uid: auth.currentUser.uid,
                date: document.getElementById('f-date').value,
                desc: document.getElementById('f-desc').value,
                amt: document.getElementById('f-amt').value,
                type: document.getElementById('f-type').value,
                ts: Date.now()
            });
            
            e.target.reset();
            btn.innerText = "Enregistrer au Cloud";
            btn.disabled = false;
            document.getElementById('f-date').valueAsDate = new Date();
        };

        // Suppression
        window.deleteItem = async (id) => {
            if(confirm("Supprimer cette transaction ?")) await deleteDoc(doc(db, "transactions", id));
        };

        document.getElementById('f-date').valueAsDate = new Date();
    </script>
</body>
</html>
