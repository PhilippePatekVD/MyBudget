<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Finance Synchro | Deep Ocean v7.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Palette Bleue Prononcée */
            --blue-dark: #0f172a;
            --blue-mid: #2563eb;
            --blue-light: #f8fafc;
            --bg-gradient: linear-gradient(180deg, #0f172a 0%, #1e3a8a 40%, #3b82f6 75%, #f8fafc 100%);
            
            --surface: rgba(255, 255, 255, 0.95);
            --card: #ffffff;
            --accent: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --text-dark: #0f172a;
            --muted: #64748b;
            --shadow: 0 15px 35px rgba(0,0,0,0.15);
            --r: 20px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .hidden { display: none !important; }
        .num { font-variant-numeric: tabular-nums lining-nums; }

        /* LOGO */
        .bank-logo {
            width: 45px; height: 45px;
            background: white; color: var(--blue-dark);
            border-radius: 12px; display: grid; place-items: center;
            font-size: 1.3rem; box-shadow: var(--shadow);
        }

        /* LOGIN */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-gradient);
        }
        .login-box {
            background: white; width: min(400px, 90%);
            padding: 40px; border-radius: var(--r);
            box-shadow: var(--shadow); text-align: center;
        }
        .login-box h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-top: 15px; }

        /* LAYOUT */
        .app-wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }
        
        .header-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: var(--r);
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header-bar h1 { font-family: 'Playfair Display', serif; color: white; font-size: 1.4rem; }
        .header-bar h1 span { color: #93c5fd; }

        /* STATS CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card {
            background: white; padding: 20px; border-radius: var(--r);
            box-shadow: var(--shadow); border-bottom: 4px solid var(--accent);
        }
        .stat-label { font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.4rem; font-weight: 800; margin-top: 5px; }

        /* MAIN */
        .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: var(--r); box-shadow: var(--shadow); }

        /* TABS */
        .tabs-nav { display: flex; gap: 5px; margin-bottom: 20px; background: #f1f5f9; padding: 5px; border-radius: 12px; }
        .tab-btn { 
            flex: 1; background: none; border: none; font: inherit; font-weight: 600; 
            color: var(--muted); cursor: pointer; padding: 8px; border-radius: 8px; font-size: 0.8rem;
        }
        .tab-btn.active { background: white; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* SAVINGS SPECIFIC */
        .savings-input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; }
        .savings-label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .savings-field { width: 120px; text-align: right; font-weight: 700; border: 1px solid #e2e8f0; padding: 8px; border-radius: 8px; }

        /* FORMS */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #e2e8f0; font: inherit; outline: none;
        }
        .btn-main {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--blue-mid); color: white; font-weight: 700; cursor: pointer;
        }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 5px; border-bottom: 1px solid #f1f5f9; font-size: 0.8rem; }
        .amt-pos { color: var(--success); font-weight: 700; }
        .amt-neg { color: var(--danger); font-weight: 700; }

        @media (max-width: 900px) { .main-grid, .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
    <div class="login-box">
        <div class="bank-logo" style="margin: 0 auto;"><i class="fa-solid fa-vault"></i></div>
        <h1>Finance <span>Synchro</span></h1>
        <p style="color: var(--muted); font-size: 0.7rem; letter-spacing: 1px; margin-top: 10px;">ACCÈS AU COFFRE PRIVÉ</p>
        <div style="margin-top: 25px;">
            <input type="email" id="email" placeholder="Email" style="margin-bottom: 10px;">
            <input type="password" id="password" placeholder="Mot de passe">
            <button class="btn-main" id="login-btn" style="margin-top: 20px;">Ouvrir le Coffre</button>
        </div>
        <p id="error-msg" style="color:var(--danger); font-size:0.75rem; margin-top:15px;"></p>
    </div>
</div>

<!-- APP -->
<div id="app-content" class="app-wrap hidden">
    <header class="header-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bank-logo" style="width:32px; height:32px; font-size:0.9rem;"><i class="fa-solid fa-building-columns"></i></div>
            <h1>Finance <span>Synchro</span></h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="filter-month" class="num" style="width: auto; padding: 4px 8px; font-size: 0.8rem; background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.3);"></select>
            <button id="logout-btn" style="background:none; border:none; color:white; cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card" style="border-color: var(--success)">
            <div class="stat-label">Revenus</div>
            <div id="res-inc" class="stat-value num" style="color: var(--success)">0.00</div>
        </div>
        <div class="stat-card" style="border-color: var(--danger)">
            <div class="stat-label">Dépenses</div>
            <div id="res-exp" class="stat-value num" style="color: var(--danger)">0.00</div>
        </div>
        <div class="stat-card" style="border-color: var(--accent)">
            <div class="stat-label">Reste à vivre</div>
            <div id="res-net" class="stat-value num">0.00</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- FORMULAIRE -->
        <div class="card">
            <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 20px; font-size: 1.2rem;" id="form-title">Nouveau Flux</h3>
            <form id="entry-form">
                <div class="input-group">
                    <div style="display: flex; gap: 5px; background: #f1f5f9; padding: 4px; border-radius: 10px;">
                        <input type="radio" name="rtype" id="t-exp" value="expense" checked style="display:none">
                        <label for="t-exp" id="l-exp" style="flex:1; text-align:center; padding:8px; margin:0; cursor:pointer; border-radius:7px; background:white; font-size:0.75rem;">Dépense</label>
                        <input type="radio" name="rtype" id="t-inc" value="income" style="display:none">
                        <label for="t-inc" id="l-inc" style="flex:1; text-align:center; padding:8px; margin:0; cursor:pointer; border-radius:7px; font-size:0.75rem;">Revenu</label>
                    </div>
                </div>
                <div class="input-group"><label>Date</label><input type="date" id="f-date" required></div>
                <div class="input-group"><label>Nom</label><input type="text" id="f-desc" placeholder="..." required></div>
                <div class="input-group"><label>CHF</label><input type="number" id="f-amt" step="0.01" required></div>
                <div class="input-group">
                    <label>Catégorie</label>
                    <select id="f-cat">
                        <optgroup label="Fixes & Factures">
                            <option value="Logement">🏠 Logement</option>
                            <option value="Assurances">🛡️ Assurances</option>
                            <option value="Électricité">⚡ Électricité</option>
                            <option value="Internet & Téléphone">📱 Internet / Mobile</option>
                            <option value="Factures administratives">📄 Administratif</option>
                            <option value="Santé">🏥 Santé</option>
                        </optgroup>
                        <optgroup label="Quotidien">
                            <option value="Alimentation">🛒 Alimentation</option>
                            <option value="Restaurant">🍴 Restaurant</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Recharge voiture">🔋 Recharge voiture</option>
                            <option value="Loisirs">🎉 Loisirs</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Abonnements digitaux">💻 Digital / Streaming</option>
                        </optgroup>
                        <optgroup label="Futur">
                            <option value="3e pillier">🏦 3e pilier</option>
                            <option value="Immobilier Suisse">🏘️ Immo CH</option>
                            <option value="Immobilier France">🇫🇷 Immo FR</option>
                            <option value="Epargne">📈 Épargne</option>
                        </optgroup>
                        <option value="Revenu">💰 Revenu</option>
                        <option value="Autre">⚙️ Autre</option>
                    </select>
                </div>
                <button type="submit" class="btn-main" id="submit-btn">Confirmer</button>
                <button type="button" id="cancel-edit" class="hidden" style="width:100%; border:none; background:none; margin-top:10px; color:var(--muted); font-size:0.8rem; cursor:pointer;">Annuler</button>
            </form>
        </div>

        <!-- AFFICHAGE -->
        <div class="card">
            <nav class="tabs-nav">
                <button class="tab-btn active" id="btn-journal">Journal</button>
                <button class="tab-btn" id="btn-repartition">Analyse</button>
                <button class="tab-btn" id="btn-comparatif">Flux</button>
                <button class="tab-btn" id="btn-epargne" style="background: var(--blue-dark); color: white;">Épargne</button>
            </nav>

            <!-- JOURNAL -->
            <div id="tab-journal">
                <table id="data-table">
                    <thead><tr><th style="width: 60px;">Date</th><th>Description</th><th style="text-align:right;">CHF</th><th></th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <!-- CHART PIE -->
            <div id="tab-repartition" class="hidden">
                <div style="height: 320px;"><canvas id="pieChart"></canvas></div>
            </div>

            <!-- CHART BAR -->
            <div id="tab-comparatif" class="hidden">
                <div style="height: 320px;"><canvas id="barChart"></canvas></div>
            </div>

            <!-- EPARGNE -->
            <div id="tab-epargne" class="hidden">
                <h4 style="margin-bottom: 20px; font-family: 'Playfair Display', serif; border-bottom: 2px solid var(--blue-dark); padding-bottom: 5px;">Avoirs Disponibles</h4>
                
                <div class="savings-input-row">
                    <div class="savings-label"><i class="fa-solid fa-chart-line" style="color:var(--accent)"></i> SwissQuote</div>
                    <input type="number" id="sq-val" class="savings-field" value="0" onchange="saveSavings()">
                </div>
                
                <div class="savings-input-row">
                    <div class="savings-label"><i class="fa-solid fa-user-shield" style="color:var(--success)"></i> Épargne Perso</div>
                    <input type="number" id="ep-val" class="savings-field" value="0" onchange="saveSavings()">
                </div>

                <div class="savings-input-row">
                    <div class="savings-label"><i class="fa-solid fa-users-rectangle" style="color:var(--danger)"></i> Épargne Commune</div>
                    <input type="number" id="ec-val" class="savings-field" value="0" onchange="saveSavings()">
                </div>

                <div style="margin-top: 30px; padding: 20px; background: var(--blue-dark); color: white; border-radius: 15px; text-align: center;">
                    <div class="stat-label" style="color:rgba(255,255,255,0.6)">Fortune Liquide Totale</div>
                    <div id="savings-total" class="num" style="font-size: 1.8rem; font-weight: 800; margin-top: 5px;">0.00 CHF</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAV_k_524LY4pPlEngZ763qeq8viYFLgJk",
        authDomain: "mybudget-ecb46.firebaseapp.com",
        projectId: "mybudget-ecb46",
        storageBucket: "mybudget-ecb46.firebasestorage.app",
        messagingSenderId: "891853073723",
        appId: "1:891853073723:web:29ec6bcf063a7fa8e8db1e",
        measurementId: "G-Q4DFKZLXLG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let allData = [];
    let pieChart, barChart;
    let editId = null;

    // --- NAVIGATION TABS ---
    const tabs = ['journal', 'repartition', 'comparatif', 'epargne'];
    tabs.forEach(t => {
        document.getElementById('btn-'+t).onclick = () => {
            tabs.forEach(tab => {
                document.getElementById('tab-'+tab).classList.add('hidden');
                document.getElementById('btn-'+tab).classList.remove('active');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active');
            render();
        };
    });

    // --- AUTH ---
    document.getElementById('login-btn').onclick = () => {
        signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .catch(err => document.getElementById('error-msg').innerText = "Accès refusé.");
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            init(user.uid); 
            subscribe(user.uid);
            loadSavings(user.uid);
        } else {
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
        }
    });

    // --- DATA SAVINGS ---
    window.saveSavings = async () => {
        const uid = auth.currentUser.uid;
        const vals = {
            sq: parseFloat(document.getElementById('sq-val').value) || 0,
            ep: parseFloat(document.getElementById('ep-val').value) || 0,
            ec: parseFloat(document.getElementById('ec-val').value) || 0
        };
        await setDoc(doc(db, "savings", uid), vals);
        calcSavingsTotal(vals);
    };

    async function loadSavings(uid) {
        const d = await getDoc(doc(db, "savings", uid));
        if (d.exists()) {
            const data = d.data();
            document.getElementById('sq-val').value = data.sq;
            document.getElementById('ep-val').value = data.ep;
            document.getElementById('ec-val').value = data.ec;
            calcSavingsTotal(data);
        }
    }

    function calcSavingsTotal(data) {
        const total = (data.sq || 0) + (data.ep || 0) + (data.ec || 0);
        document.getElementById('savings-total').innerText = total.toLocaleString('fr-CH', { minimumFractionDigits: 2 }) + " CHF";
    }

    // --- APP LOGIC ---
    function init(uid) {
        const select = document.getElementById('filter-month');
        const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        select.innerHTML = '<option value="all">Historique</option>';
        for(let i=0; i<12; i++) {
            const val = `2026-${String(i+1).padStart(2, '0')}`;
            select.innerHTML += `<option value="${val}" ${i === new Date().getMonth() ? 'selected' : ''}>${months[i]}</option>`;
        }
        select.onchange = render;
        document.getElementById('f-date').valueAsDate = new Date();
    }

    function subscribe(uid) {
        const q = query(collection(db, "transactions"), where("uid", "==", uid));
        onSnapshot(q, (snap) => {
            allData = [];
            snap.forEach(d => allData.push({id: d.id, ...d.data()}));
            render();
        });
    }

    function render() {
        const filter = document.getElementById('filter-month').value;
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "";
        let inc = 0, exp = 0, stats = {};

        const filtered = allData.sort((a,b) => new Date(b.date) - new Date(a.date)).filter(d => filter === 'all' || d.date.startsWith(filter));

        filtered.forEach(t => {
            const amt = parseFloat(t.amt);
            if(t.type === 'income') inc += amt; 
            else { exp += amt; stats[t.cat] = (stats[t.cat] || 0) + amt; }

            tbody.innerHTML += `<tr>
                <td><small style="color:var(--muted)">${t.date.split('-').reverse().slice(0,2).join('.')}</small></td>
                <td><b>${t.desc}</b></td>
                <td style="text-align:right" class="${t.type === 'income' ? 'amt-pos' : 'amt-neg'}">${amt.toFixed(2)}</td>
                <td style="text-align:right">
                    <i class="fa-solid fa-pen" onclick="window.edit('${t.id}')" style="cursor:pointer; opacity:0.2; font-size:0.7rem; margin-right:8px"></i>
                    <i class="fa-solid fa-trash" onclick="window.del('${t.id}')" style="cursor:pointer; opacity:0.2; font-size:0.7rem"></i>
                </td>
            </tr>`;
        });

        document.getElementById('res-inc').innerText = inc.toFixed(2);
        document.getElementById('res-exp').innerText = exp.toFixed(2);
        document.getElementById('res-net').innerText = (inc - exp).toFixed(2);

        drawCharts(stats, inc, exp);
    }

    function drawCharts(stats, inc, exp) {
        if(!document.getElementById('tab-repartition').classList.contains('hidden')) {
            const ctxP = document.getElementById('pieChart').getContext('2d');
            if(pieChart) pieChart.destroy();
            pieChart = new Chart(ctxP, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(stats),
                    datasets: [{ data: Object.values(stats), backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'], borderWidth: 0 }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }, cutout: '75%' }
            });
        }

        if(!document.getElementById('tab-comparatif').classList.contains('hidden')) {
            const ctxB = document.getElementById('barChart').getContext('2d');
            if(barChart) barChart.destroy();
            barChart = new Chart(ctxB, {
                type: 'bar',
                data: {
                    labels: ['Flux'],
                    datasets: [
                        { label: 'Revenus', data: [inc], backgroundColor: '#10b981', borderRadius: 5 },
                        { label: 'Dépenses', data: [exp], backgroundColor: '#ef4444', borderRadius: 5 }
                    ]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    // --- FORM ACTIONS ---
    document.getElementById('t-exp').onclick = () => { document.getElementById('l-exp').style.background = 'white'; document.getElementById('l-inc').style.background = 'none'; };
    document.getElementById('t-inc').onclick = () => { document.getElementById('l-inc').style.background = 'white'; document.getElementById('l-exp').style.background = 'none'; };

    document.getElementById('entry-form').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            uid: auth.currentUser.uid,
            date: document.getElementById('f-date').value,
            desc: document.getElementById('f-desc').value,
            amt: document.getElementById('f-amt').value,
            cat: document.getElementById('f-cat').value,
            type: document.querySelector('input[name="rtype"]:checked').value,
            ts: Date.now()
        };
        if(editId) await updateDoc(doc(db, "transactions", editId), data);
        else await addDoc(collection(db, "transactions"), data);
        window.cancelEdit();
    };

    window.edit = (id) => {
        const t = allData.find(d => d.id === id);
        editId = id;
        document.getElementById('f-date').value = t.date;
        document.getElementById('f-desc').value = t.desc;
        document.getElementById('f-amt').value = t.amt;
        document.getElementById('f-cat').value = t.cat;
        document.getElementById(t.type === 'income' ? 't-inc' : 't-exp').click();
        document.getElementById('form-title').innerText = "Modifier Flux";
        document.getElementById('submit-btn').innerText = "Mettre à jour";
        document.getElementById('cancel-edit').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelEdit = () => {
        editId = null;
        document.getElementById('entry-form').reset();
        document.getElementById('form-title').innerText = "Nouveau Flux";
        document.getElementById('submit-btn').innerText = "Confirmer";
        document.getElementById('cancel-edit').classList.add('hidden');
    };
    document.getElementById('cancel-edit').onclick = window.cancelEdit;

    window.del = async (id) => { if(confirm("Supprimer ?")) await deleteDoc(doc(db, "transactions", id)); };
</script>
</body>
</html>
