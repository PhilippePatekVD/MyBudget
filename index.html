<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Finance Synchro | Premium Edition</title>
    
    <!-- Polices de Luxe -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0a0f1d; 
            --card: rgba(30, 41, 59, 0.7); 
            --accent: #d4af37; /* Or luxueux */
            --accent-light: #f1e5ac;
            --success: #10b981; 
            --danger: #ff4d4d; 
            --text: #f8fafc;
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08), transparent), var(--bg);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1100px; margin: auto; }
        
        /* LOGIN OVERLAY */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { 
            background: var(--card); 
            padding: 50px 40px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2rem; 
            margin: 0; 
            letter-spacing: 1px;
            font-weight: 700;
        }
        h1 span { color: var(--accent); }

        .month-selector { 
            background: transparent; 
            padding: 8px 15px; 
            border-radius: 8px; 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            font-weight: 600;
            font-size: 0.9rem;
        }
        .month-selector select { background: none; border: none; color: inherit; font-family: inherit; font-weight: 600; outline: none; cursor: pointer; }

        /* SUMMARY CARDS */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--card); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--border); }
        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: 600; }
        .stat-value { font-size: 1.6rem; font-weight: 700; font-family: 'Montserrat', sans-serif; }

        /* DASHBOARD LAYOUT */
        .dashboard-grid { display: grid; grid-template-columns: 380px 1fr; gap: 30px; align-items: start; }
        .card { background: var(--card); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-top: 0; margin-bottom: 25px; color: var(--accent-light); }

        /* FORM */
        .type-toggle { display: flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .type-toggle input { display: none; }
        .type-toggle label { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-radius: 10px; font-size: 0.85rem; transition: 0.3s; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        #t-exp:checked + label { background: var(--danger); color: white; }
        #t-inc:checked + label { background: var(--success); color: white; }

        input, select, .btn-submit { 
            width: 100%; 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(15, 23, 42, 0.8); 
            color: white; 
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
        }
        input:focus { outline: none; border-color: var(--accent); }

        .btn-submit { 
            background: linear-gradient(135deg, var(--accent), #b8860b); 
            border: none; 
            font-weight: 700; 
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            margin-top: 25px;
            transition: opacity 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }
        
        /* TABLE */
        .table-wrapper { margin-top: 10px; overflow-y: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 18px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; }
        th { text-align: left; padding: 12px; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); }
        
        .amt-pos { color: var(--success); font-weight: 700; }
        .amt-neg { color: var(--danger); font-weight: 700; }
        .hidden { display: none !important; }

        @media (max-width: 900px) { .dashboard-grid, .summary-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Écran de Connexion -->
    <div id="login-overlay">
        <div class="login-box">
            <h1 style="margin-bottom:10px">Finance <span>Synchro</span></h1>
            <p style="color:#94a3b8; font-size: 0.8rem; margin-bottom: 30px; letter-spacing: 1px;">AUTHENTIFICATION PRIVÉE</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button class="btn-submit" id="login-btn">Accéder au Coffre</button>
            <p id="error-msg" style="color:var(--danger); font-size:0.75rem; margin-top:15px; font-weight:600;"></p>
        </div>
    </div>

    <!-- Application Principale -->
    <div id="app-content" class="container hidden">
        <header>
            <h1>Finance <span>Synchro</span></h1>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div class="month-selector">
                    <select id="filter-month"></select>
                </div>
                <button id="logout-btn" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size: 1.2rem;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
            </div>
        </header>

        <div class="summary-grid">
            <div class="stat-card"><div class="stat-label">Revenus Mensuels</div><div id="res-inc" class="stat-value" style="color: var(--success);">+ 0.00</div></div>
            <div class="stat-card"><div class="stat-label">Dépenses Mensuelles</div><div id="res-exp" class="stat-value" style="color: var(--danger);">- 0.00</div></div>
            <div class="stat-card" style="border: 1px solid var(--border)"><div class="stat-label">Solde Net</div><div id="res-net" class="stat-value" style="color: var(--accent);">0.00 CHF</div></div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Nouvelle Entrée</h3>
                <form id="entry-form">
                    <div class="type-toggle">
                        <input type="radio" name="rtype" id="t-exp" value="expense" checked><label for="t-exp">Dépense</label>
                        <input type="radio" name="rtype" id="t-inc" value="income"><label for="t-inc">Revenu</label>
                    </div>
                    <input type="date" id="f-date" required>
                    <input type="text" id="f-desc" placeholder="Libellé de l'opération" required>
                    <input type="number" id="f-amt" step="0.01" placeholder="Montant (CHF)" required>
                    <select id="f-cat">
                        <option value="Logement">🏠 Logement</option>
                        <option value="Alimentation">🛒 Alimentation</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Loisirs">🎉 Loisirs</option>
                        <option value="Santé">🏥 Santé</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Revenu">💰 Revenus Professionnels</option>
                        <option value="Autre">⚙️ Autre</option>
                    </select>
                    <button type="submit" class="btn-submit" id="submit-btn">Sécuriser l'opération</button>
                </form>
            </div>

            <div class="card">
                <h3>Analyse de Portefeuille</h3>
                <div style="height: 250px; margin-bottom: 20px;"><canvas id="myChart"></canvas></div>
                
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Date</th><th>Description</th><th>Montant</th><th></th></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAV_k_524LY4pPlEngZ763qeq8viYFLgJk",
            authDomain: "mybudget-ecb46.firebaseapp.com",
            projectId: "mybudget-ecb46",
            storageBucket: "mybudget-ecb46.firebasestorage.app",
            messagingSenderId: "891853073723",
            appId: "1:891853073723:web:29ec6bcf063a7fa8e8db1e",
            measurementId: "G-Q4DFKZLXLG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let myChart = null;
        let allData = [];

        document.getElementById('login-btn').onclick = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => {
                document.getElementById('error-msg').innerText = "ACCÈS REFUSÉ : Identifiants non reconnus.";
            });
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                init();
                subscribe(user.uid);
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        function init() {
            const select = document.getElementById('filter-month');
            const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            select.innerHTML = '<option value="all">Historique Global</option>';
            for(let i=0; i<12; i++) {
                const val = `2026-${String(i+1).padStart(2, '0')}`;
                select.innerHTML += `<option value="${val}" ${i === new Date().getMonth() ? 'selected' : ''}>${months[i]} 2026</option>`;
            }
            select.onchange = render;
            document.getElementById('f-date').valueAsDate = new Date();
        }

        function subscribe(uid) {
            const q = query(collection(db, "transactions"), where("uid", "==", uid));
            onSnapshot(q, (snap) => {
                allData = [];
                snap.forEach(d => allData.push({id: d.id, ...d.data()}));
                render();
            });
        }

        function render() {
            const filter = document.getElementById('filter-month').value;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            let inc = 0, exp = 0, stats = {};

            const sorted = allData.sort((a,b) => new Date(b.date) - new Date(a.date));

            sorted.filter(d => filter === 'all' || d.date.startsWith(filter)).forEach(t => {
                const amt = parseFloat(t.amt);
                if(t.type === 'income') inc += amt; 
                else { exp += amt; stats[t.cat] = (stats[t.cat] || 0) + amt; }

                tbody.innerHTML += `<tr>
                    <td><small style="color:#94a3b8">${t.date.split('-').reverse().slice(0,2).join('.')}</small></td>
                    <td><b style="font-weight:600">${t.desc}</b><br><span style="font-size:0.65rem; color:var(--accent); text-transform:uppercase; letter-spacing:1px">${t.cat}</span></td>
                    <td class="${t.type === 'income' ? 'amt-pos' : 'amt-neg'}">${amt.toFixed(2)}</td>
                    <td style="text-align:right"><i class="fa-solid fa-trash-can" style="cursor:pointer; opacity:0.2" onclick="window.del('${t.id}')"></i></td>
                </tr>`;
            });

            document.getElementById('res-inc').innerText = "+ " + inc.toLocaleString('fr-CH', {minimumFractionDigits: 2});
            document.getElementById('res-exp').innerText = "- " + exp.toLocaleString('fr-CH', {minimumFractionDigits: 2});
            const net = inc - exp;
            document.getElementById('res-net').innerText = net.toLocaleString('fr-CH', {minimumFractionDigits: 2}) + " CHF";
            document.getElementById('res-net').style.color = net >= 0 ? 'var(--accent)' : 'var(--danger)';
            draw(stats);
        }

        document.getElementById('entry-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";

            try {
                await addDoc(collection(db, "transactions"), {
                    uid: auth.currentUser.uid,
                    date: document.getElementById('f-date').value,
                    desc: document.getElementById('f-desc').value,
                    amt: document.getElementById('f-amt').value,
                    cat: document.getElementById('f-cat').value,
                    type: document.querySelector('input[name="rtype"]:checked').value,
                    ts: Date.now()
                });
                e.target.reset();
                document.getElementById('f-date').valueAsDate = new Date();
            } catch (error) {
                alert("Erreur de sécurité : " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sécuriser l'opération";
            }
        };

        window.del = async (id) => { if(confirm("Archiver définitivement cette transaction ?")) await deleteDoc(doc(db, "transactions", id)); };

        function draw(stats) {
            const ctx = document.getElementById('myChart');
            if(myChart) myChart.destroy();
            if(Object.keys(stats).length === 0) return;
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(stats),
                    datasets: [{ 
                        data: Object.values(stats), 
                        backgroundColor: ['#d4af37', '#10b981', '#3b82f6', '#ff4d4d', '#8b5cf6', '#ec4899'], 
                        borderWidth: 2,
                        borderColor: '#0a0f1d'
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { 
                            position: 'right', 
                            labels: { color: '#94a3b8', font: { size: 10, family: 'Montserrat' } } 
                        } 
                    }, 
                    cutout: '80%' 
                }
            });
        }
    </script>
</body>
</html>
