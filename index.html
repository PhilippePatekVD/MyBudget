<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Office">
  <meta name="description" content="Family Office personnel : budget, patrimoine, prévoyance, immobilier, projets et suivi familial.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Family Office</title>
</head>
<body>
  <div id="login" class="login-shell">
    <section class="login-card">
      <div class="monogram">FO</div>
      <p class="eyebrow">Family Office</p>
      <h1>Votre vie financière.<br>Au même endroit.</h1>
      <p class="lead">Budget, patrimoine, prévoyance, immobilier et projets, synchronisés avec votre espace privé Firebase existant.</p>
      <form id="loginForm" class="login-form">
        <label>Adresse e-mail<input id="email" type="email" autocomplete="username" required></label>
        <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Ouvrir mon espace</button>
        <div id="loginError" class="form-error"></div>
      </form>
    </section>
  </div>

  <div id="shell" class="shell hidden">
    <header class="topbar">
      <button class="brand" data-view="dashboard" aria-label="Accueil">
        <span class="brand-mark">FO</span>
        <span><b>Family Office</b><small id="userLabel">Espace privé</small></span>
      </button>
      <nav id="mainNav" class="main-nav" aria-label="Navigation principale">
        <button data-view="dashboard" class="active">Vue d’ensemble</button>
        <button data-view="budget">Budget</button>
        <button data-view="patrimoine">Patrimoine</button>
        <button data-view="prevoyance">Prévoyance</button>
        <button data-view="immobilier">Immobilier</button>
        <button data-view="credits">Crédits</button>
        <button data-view="projets">Projets</button>
        <button data-view="sport">Sport</button>
      </nav>
      <button id="logoutBtn" class="icon-btn" aria-label="Déconnexion">↗</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>
    <footer>Family Office · données privées via Firebase · aucune API payante · aucune transaction exécutée automatiquement.</footer>
  </div>

  <div id="modal" class="modal-backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><div><p id="modalEyebrow" class="eyebrow"></p><h2 id="modalTitle"></h2></div><button id="modalClose" class="icon-btn">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
