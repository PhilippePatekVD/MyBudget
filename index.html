<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Finance Cockpit v5.0 | Dashboard Cloud</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6;
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px; 
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent), var(--bg);
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: auto; }
        
        /* LOGIN OVERLAY */
        #login-overlay { 
            position: fixed; inset: 0; background: var(--bg); 
            display: flex; align-items: center; justify-content: center; z-index: 9999; 
        }
        .login-box { 
            background: var(--card); padding: 40px; border-radius: 28px; 
            width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border);
        }

        /* HEADER & FILTERS */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        h1 { font-family: 'Urbanist', sans-serif; font-size: 1.8rem; margin: 0; }
        h1 span { color: var(--accent); }

        .month-selector {
            background: var(--card); padding: 8px 15px; border-radius: 12px;
            border: 1px solid var(--accent); color: var(--accent); font-weight: 700;
        }
        .month-selector select { background: none; border: none; color: inherit; font-family: inherit; font-weight: 700; outline: none; cursor: pointer; }

        /* SUMMARY CARDS */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; opacity: 0.5; }
        .stat-income::after { background: var(--success); }
        .stat-expense::after { background: var(--danger); }
        .stat-net::after { background: var(--accent); }
        
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }

        /* DASHBOARD LAYOUT */
        .dashboard-grid { display: grid; grid-template-columns: 380px 1fr; gap: 25px; align-items: start; }

        .card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h3 { font-family: 'Urbanist', sans-serif; font-size: 1.2rem; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* FORM */
        .type-toggle { display: flex; background: #0f172a; border-radius: 10px; padding: 4px; margin-bottom: 15px; }
        .type-toggle input { display: none; }
        .type-toggle label { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; font-weight: 600; }
        #t-exp:checked + label { background: var(--danger); color: white; }
        #t-inc:checked + label { background: var(--success); color: white; }

        input, select, .btn-submit { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }
        .btn-submit { background: var(--accent); border: none; font-weight: 700; cursor: pointer; margin-top: 20px; }
        
        /* TABLE */
        .table-wrapper { margin-top: 25px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.95rem; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .amt-pos { color: var(--success); font-weight: 700; }
        .amt-neg { color: var(--danger); font-weight: 700; }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Écran de Connexion -->
    <div id="login-overlay">
        <div class="login-box">
            <h1>Finance <span>Cloud</span></h1>
            <p style="color:#94a3b8; margin-bottom: 25px;">Connectez-vous pour synchroniser vos données</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button class="btn-submit" onclick="login()">Se connecter</button>
        </div>
    </div>

    <!-- Application Principale -->
    <div id="app-content" class="container hidden">
        <header>
            <h1>Cockpit <span>Synchro</span></h1>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="month-selector">
                    <i class="fa-solid fa-calendar-days"></i>
                    <select id="filter-month" onchange="refreshData()"></select>
                </div>
                <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <div class="summary-grid">
            <div class="stat-card stat-income">
                <div class="stat-label">Revenus (Entrées)</div>
                <div id="res-inc" class="stat-value" style="color: var(--success);">+ 0.00</div>
            </div>
            <div class="stat-card stat-expense">
                <div class="stat-label">Dépenses (Sorties)</div>
                <div id="res-exp" class="stat-value" style="color: var(--danger);">- 0.00</div>
            </div>
            <div class="stat-card stat-net">
                <div class="stat-label">Reste à vivre</div>
                <div id="res-net" class="stat-value">0.00 CHF</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Colonne de Saisie -->
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle" style="color:var(--accent)"></i> Nouvelle Opération</h3>
                <form id="entry-form">
                    <div class="type-toggle">
                        <input type="radio" name="rtype" id="t-exp" value="expense" checked>
                        <label for="t-exp">Dépense</label>
                        <input type="radio" name="rtype" id="t-inc" value="income">
                        <label for="t-inc">Revenu</label>
                    </div>
                    <input type="date" id="f-date" required>
                    <input type="text" id="f-desc" placeholder="Libellé (ex: Salaire, Loyer...)" required>
                    <input type="number" id="f-amt" step="0.01" placeholder="Montant en CHF" required>
                    <select id="f-cat">
                        <option value="Revenu">💰 Salaire / Revenus</option>
                        <option value="Logement">🏠 Logement & Charges</option>
                        <option value="Alimentation">🛒 Alimentation</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Loisirs">🎉 Loisirs & Sorties</option>
                        <option value="Santé">🏥 Santé</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Epargne">📈 Épargne</option>
                        <option value="Autre">⚙️ Autre</option>
                    </select>
                    <button type="submit" class="btn-submit">Enregistrer au Cloud</button>
                </form>
            </div>

            <!-- Colonne Graphique -->
            <div class="card">
                <h3><i class="fa-solid fa-chart-pie" style="color:var(--success)"></i> Répartition Mensuelle</h3>
                <div style="height: 250px; position: relative;">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

            <!-- Historique (Pleine largeur sous les deux colonnes) -->
            <div class="card" style="grid-column: 1 / -1;">
                <h3><i class="fa-solid fa-list-ul"></i> Historique des flux</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Catégorie</th>
                                <th>Montant</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURATION FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAV_k_524LY4pPlEngZ763qeq8viYFLgJk",
            authDomain: "mybudget-ecb46.firebaseapp.com",
            projectId: "mybudget-ecb46",
            storageBucket: "mybudget-ecb46.firebasestorage.app",
            messagingSenderId: "891853073723",
            appId: "1:891853073723:web:29ec6bcf063a7fa8e8db1e",
            measurementId: "G-Q4DFKZLXLG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let myChart = null;
        let allData = [];

        // INITIALISATION DES FILTRES DE MOIS
        function initMonthSelector() {
            const select = document.getElementById('filter-month');
            const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            const now = new Date();
            select.innerHTML = '<option value="all">Toutes les périodes</option>';
            for(let i=0; i<12; i++) {
                const val = `2026-${String(i+1).padStart(2, '0')}`; // Année 2026 forcée
                const opt = document.createElement('option');
                opt.value = val;
                opt.text = `${months[i]} 2026`;
                if(i === now.getMonth()) opt.selected = true;
                select.appendChild(opt);
            }
        }

        // AUTHENTIFICATION
        window.login = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Erreur : Identifiants incorrects"));
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                initMonthSelector();
                subscribeData(user.uid);
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // SYNCHRONISATION CLOUD
        function subscribeData(uid) {
            const q = query(collection(db, "transactions"), where("uid", "==", uid), orderBy("ts", "desc"));
            onSnapshot(q, (snap) => {
                allData = [];
                snap.forEach(d => allData.push({id: d.id, ...d.data()}));
                refreshData();
            });
        }

        // RECALCUL ET AFFICHAGE
        window.refreshData = () => {
            const filter = document.getElementById('filter-month').value;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";

            let inc = 0, exp = 0, stats = {};

            const filtered = allData.filter(d => filter === 'all' || d.date.startsWith(filter))
                                    .sort((a,b) => new Date(b.date) - new Date(a.date));

            filtered.forEach(t => {
                const amt = parseFloat(t.amt);
                if(t.type === 'income') {
                    inc += amt;
                } else {
                    exp += amt;
                    stats[t.cat] = (stats[t.cat] || 0) + amt;
                }

                const row = tbody.insertRow();
                row.innerHTML = `
                    <td><small style="color:#94a3b8">${t.date}</small></td>
                    <td style="font-weight:600">${t.desc}</td>
                    <td><span class="badge">${t.cat}</span></td>
                    <td class="${t.type === 'income' ? 'amt-pos' : 'amt-neg'}">
                        ${t.type === 'income' ? '+' : '-'} ${amt.toFixed(2)}
                    </td>
                    <td style="text-align:right">
                        <i class="fa-solid fa-trash" onclick="deleteItem('${t.id}')" style="cursor:pointer; color:#334155; font-size:0.8rem"></i>
                    </td>
                `;
            });

            document.getElementById('res-inc').innerText = "+ " + inc.toFixed(2);
            document.getElementById('res-exp').innerText = "- " + exp.toFixed(2);
            const net = inc - exp;
            document.getElementById('res-net').innerText = net.toFixed(2) + " CHF";
            document.getElementById('res-net').style.color = net >= 0 ? 'var(--success)' : 'var(--danger)';

            updateChart(stats);
        };

        // GESTION FORMULAIRE
        document.getElementById('entry-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Synchronisation...";

            await addDoc(collection(db, "transactions"), {
                uid: auth.currentUser.uid,
                date: document.getElementById('f-date').value,
                desc: document.getElementById('f-desc').value,
                amt: document.getElementById('f-amt').value,
                cat: document.getElementById('f-cat').value,
                type: document.querySelector('input[name="rtype"]:checked').value,
                ts: Date.now()
            });

            e.target.reset();
            document.getElementById('f-date').valueAsDate = new Date();
            btn.disabled = false;
            btn.innerText = "Enregistrer au Cloud";
        };

        window.deleteItem = async (id) => {
            if(confirm("Supprimer cette transaction ?")) await deleteDoc(doc(db, "transactions", id));
        };

        function updateChart(stats) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(stats),
                    datasets: [{
                        data: Object.values(stats),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                        borderWidth: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10 } } } },
                    cutout: '75%'
                }
            });
        }

        document.getElementById('f-date').valueAsDate = new Date();
    </script>
</body>
</html>
